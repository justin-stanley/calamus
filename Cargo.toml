[package]
name = "calamus"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.94"
description = "An atproto OAuth client: identity resolution, discovery, PAR + PKCE + DPoP, private_key_jwt, sessions, revocation, and an SSRF-guarded fetcher."
# The code is extracted from FeatherReader (AGPL-3.0-only). Until the owner chooses
# calamus's own license, it stays under FeatherReader's, and the crate is not published.
license = "AGPL-3.0-only"
publish = false
repository = "https://git.justin-stanley.com/justin/calamus"

[dependencies]
anyhow = "1"
base64 = "0.23"
getrandom = "0.4"
# Handle -> DID by `_atproto.<handle>` TXT record, which the handle spec makes the
# PREFERRED method (a real handle resolves by TXT alone; its well-known 404s), so
# `tokio::net::lookup_host` (A/AAAA only) is not enough. Behind the default-on
# `dns` feature: `resolve::SystemResolver` is its only user, and a caller with its
# own resolver implements `resolve::DnsResolver` instead. FeatherReader's exact
# spec; default-features are already the minimum, and the host's own resolver
# configuration is the correct behaviour for handle resolution.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
# The SSRF-guarded fetcher (`net`). FeatherReader's exact spec: rustls rather than
# native-tls, gzip because FeatherReader's feed fetch shares the fetcher, json for
# the callers' request bodies.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
# `net` needs only the resolver (`lookup_host`); `test-util` adds what its test
# servers need.
tokio = { version = "1.45", features = ["net", "sync", "time"] }
tracing = "0.1"
url = "2"

# The test certificate authority and TLS test server in `calamus::testing`. Only
# ever enabled by the `test-util` feature (and, as dev-dependencies below, by this
# crate's own tests), so neither is in a release build's graph. Same versions and
# features as FeatherReader's dev-dependencies.
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "crypto", "ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "crypto", "ring"] }
tokio = { version = "1.45", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[features]
default = ["dns"]
# `resolve::SystemResolver`: DNS TXT lookups through hickory with the host's own
# resolver configuration.
dns = ["dep:hickory-resolver"]
# `revoke::{sign_out, sign_out_with}`: revoke a session's tokens, then delete it
# from a `store::SessionStore`, bounded and safe against a concurrent refresh.
# The RFC 7009 request itself (`revoke::{try_revoke, revoke_tokens,
# revoke_orphaned}`) is always built: the refresh path needs it.
revoke = []
# `xrpc::Repo`: DPoP-bound XRPC calls (`get`, `post_json`) against a session's
# PDS, with a non-2xx answer as a typed `xrpc::XrpcError`. The transport only:
# record listing, writers and lexicon types belong to the caller.
xrpc = []
# Test helpers for crates that depend on calamus: `client_auth::record_evidence`
# and `calamus::testing` (the test CA, TLS and HTTP test servers, and per-Fetcher
# host overrides, which deliberately bypass the SSRF guard for named hosts).
# Never enable it outside [dev-dependencies]; scripts/ci.sh proves it is absent
# from a default build.
test-util = ["dep:rcgen", "dep:tokio-rustls", "tokio/io-util", "tokio/macros", "tokio/rt", "tokio/sync"]

[lints.rust]
unsafe_code = "forbid"

# The end-to-end suites run against `calamus::testing::fake` (the fake
# authorization server, PDS, PLC directory and DNS), so they need `test-util`;
# `scripts/ci.sh` runs them with every feature on. None touches the network.
[[test]]
name = "e2e_login"
required-features = ["test-util"]

[[test]]
name = "e2e_identity_only"
required-features = ["test-util"]

[[test]]
name = "e2e_refresh"
required-features = ["test-util"]

[[test]]
name = "e2e_revoke"
required-features = ["test-util", "revoke"]

[[test]]
name = "e2e_xrpc"
required-features = ["test-util", "xrpc"]

[[test]]
name = "e2e_proof_replay"
required-features = ["test-util"]

# The messages callers match on, pinned, and the typed `calamus::Error` behind
# each decision. Every path it drives: login, refresh, sign-out and XRPC.
[[test]]
name = "e2e_errors"
required-features = ["test-util", "revoke", "xrpc"]
