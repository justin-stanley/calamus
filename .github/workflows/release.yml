name: Release
# A final tag `vX.Y.Z` publishes calamus to crates.io and creates the GitHub
# release. FeatherReader's release discipline, with three additions for a
# library (design/OPEN-SOURCE.md §5):
#
# * Release candidates (`vX.Y.Z-rc.N`, anything with a `-`) are refused before
#   anything else: they soak in FeatherReader, never on crates.io.
# * The publish job runs in the `crates-io` environment, which requires the
#   maintainer's approval, so an irreversible publish needs a deliberate click
#   and not just a pushed tag.
# * The exact `.crate` that is uploaded gets SLSA build provenance, verifiable
#   with `gh attestation verify calamus-X.Y.Z.crate --repo justin-stanley/calamus`.
#
# Publishing uses crates.io Trusted Publishing (OIDC): no token is stored here.
# One-time setup on crates.io: calamus -> Settings -> Trusted Publishing ->
# repository justin-stanley/calamus, workflow release.yml, environment crates-io.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A final tag that is already pushed, e.g. v0.1.0"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: A final tag matching Cargo.toml, with a CHANGELOG section
        id: check
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-*) echo "::notice::$TAG is a release candidate: it soaks in FeatherReader and is never published"; exit 1 ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a vX.Y.Z tag"; exit 1 ;;
          esac
          version="${TAG#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ "$crate" = "$version" ] || { echo "::error::tag $TAG but Cargo.toml says $crate"; exit 1; }
          if grep -q '^publish = false' Cargo.toml; then
            echo "::error::Cargo.toml still has publish = false"; exit 1
          fi
          scripts/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    environment: crates-io # requires the maintainer's approval
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing, and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Package (and verify it builds)
        run: cargo package --locked
      - name: Attest the .crate's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/calamus-${{ needs.check.outputs.version }}.crate
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify # verified by `cargo package` above
      - name: Keep the .crate with the run
        run: cp target/package/calamus-*.crate "$RUNNER_TEMP/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: ${{ runner.temp }}/calamus-*.crate

  github-release:
    name: GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: dist
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release; leaving it"; exit 0
          fi
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "**Crate:** [calamus $VERSION](https://crates.io/crates/calamus/$VERSION) · [docs](https://docs.rs/calamus/$VERSION)"
            echo
            echo "Verify the attached \`.crate\` came from this workflow: \`gh attestation verify calamus-$VERSION.crate --repo $GITHUB_REPOSITORY\`"
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.crate --repo "$GITHUB_REPOSITORY" \
            --title "calamus $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
