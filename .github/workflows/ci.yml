name: CI
# The gate. `Rust` runs scripts/ci.sh, the same script contributors run locally;
# the supply-chain and secret checks are their own jobs so each is a required
# status check by name.
#
# Unlike FeatherReader's (which once ran on a self-hosted runner), this runs on
# pull requests from forks too: everything is GitHub-hosted, the token is
# read-only, and no secrets are used, so a fork's code can't reach anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned tool versions, bumped deliberately (the Dependabot `cargo` group
  # does not see these).
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_SEMVER_CHECKS_VERSION: 0.51.0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: scripts/ci.sh
        env:
          CALAMUS_CI_SPLIT: "1" # deny and audit run as their own jobs below
        run: scripts/ci.sh
      - name: The example runs
        run: cargo run --locked --example sign_in --features test-util,revoke

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Build and test on the MSRV
        run: |
          cargo build --locked --all-features
          cargo test --locked --all-features

  package:
    name: Package
    # What crates.io would receive: only the library and its notices, under
    # 1 MiB, and it builds from the packaged sources alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: cargo package
        run: |
          set -euo pipefail
          # `publish = false` until 0.1.0; --no-verify skips nothing that the
          # build step below does not do, and lets this run before then.
          cargo package --locked --allow-dirty --no-verify
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          crate="target/package/calamus-${version}.crate"
          echo "packaged $crate ($(stat -c %s "$crate") bytes)"
          [ "$(stat -c %s "$crate")" -le 1048576 ] || { echo "::error::$crate is over 1 MiB"; exit 1; }
          bad="$(tar -tzf "$crate" | sed 's#^[^/]*/##' \
            | grep -vE '^(src/.*\.rs|Cargo\.toml|Cargo\.toml\.orig|Cargo\.lock|README\.md|LICENSE|CHANGELOG\.md|\.cargo_vcs_info\.json)$' || true)"
          if [ -n "$bad" ]; then echo "::error::unexpected files in the crate:"; echo "$bad"; exit 1; fi
      - name: The packaged sources build alone
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          dir="$(mktemp -d)"; tar -xzf "target/package/calamus-${version}.crate" -C "$dir"
          cd "$dir"/calamus-* && cargo build --all-features

  semver:
    name: semver
    # Breaking changes need a version bump. Compares against the latest final
    # release tag; before the first release there is nothing to compare with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Find the baseline
        id: base
        run: |
          tag="$(git tag -l 'v[0-9]*' | grep -v -- - | sort -V | tail -n1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] || echo "::notice::no final release yet; nothing to compare against"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: steps.base.outputs.tag != ''
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: cargo semver-checks
        if: steps.base.outputs.tag != ''
        env:
          BASELINE: ${{ steps.base.outputs.tag }}
        run: cargo semver-checks --baseline-rev "$BASELINE" --all-features

  docs-rs:
    name: docs.rs
    # Builds the docs the way docs.rs does (nightly, all features, --cfg docsrs),
    # so a broken docs.rs page is caught before a release. The nightly is pinned,
    # so a new rustdoc lint can't turn an unrelated pull request red; bump it
    # deliberately.
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: cargo doc (docs.rs settings)
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo "+$NIGHTLY" doc --no-deps --all-features --locked

  cargo-deny:
    name: cargo deny (licenses + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check bans licenses sources

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      - run: cargo audit -D warnings

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's
      # checksums file. Bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tree
          persist-credentials: false
      # The binary, not gitleaks-action: the action needs a licence key for some
      # accounts and does PR bookkeeping with the token; the binary needs neither.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$RUNNER_TEMP/gitleaks"
      - name: gitleaks (history and tree)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1'
